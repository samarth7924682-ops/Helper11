<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Admin</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121418;--card:#1e222b;--gold:#ffb703;--text:#fff;--gray:#94a3b8;--green:#2ecc71;--red:#e74c3c;--line:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:var(--text);padding:16px;display:flex;justify-content:center;min-height:100vh}
.wrapper{width:100%;max-width:480px}
header{text-align:center;margin-bottom:18px}
header h1{font-family:'Oswald',sans-serif;color:var(--gold);font-size:26px;text-transform:uppercase;letter-spacing:1px}
header p{font-size:11px;color:var(--gray)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.label{font-family:'Oswald',sans-serif;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:0 0 10px 2px}
input,select{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:#12151b;color:var(--text);font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--gold);color:#000;font-weight:600;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
button.sec{background:transparent;border:1px solid var(--line);color:var(--gray)}
button.green{background:var(--green)}
button.red{background:var(--red);color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.hidden{display:none!important}
.err{color:var(--red);font-size:12px;margin:-4px 0 10px 2px;min-height:14px}
.bal{text-align:center;padding:10px 0}
.bal small{color:var(--gray);font-size:12px}
.bal h2{font-family:'Oswald',sans-serif;font-size:40px;color:var(--gold)}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.item:last-child{border-bottom:none}
.item .l{min-width:0}
.item .t{font-size:14px;font-weight:600;word-break:break-word}
.item .s{font-size:11px;color:var(--gray)}
.item .r{text-align:right;white-space:nowrap}
.cr{color:var(--green);font-weight:600}
.dr{color:var(--red);font-weight:600}
.user-row{cursor:pointer}
.empty{text-align:center;color:var(--gray);font-size:13px;padding:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{background:var(--card);color:var(--gray);border:1px solid var(--line)}
.tabs button.on{background:var(--gold);color:#000}
</style>
</head>
<body>
<div class="wrapper">
  <header><h1>🛠 Wallet Admin</h1><p>Users aur unka hisab manage karo</p></header>

  <!-- LOGIN -->
  <div id="loginView">
    <div class="card">
      <div class="label">Admin Login</div>
      <input id="lid" placeholder="Admin ID" autocomplete="username" autocapitalize="none">
      <input id="lpass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="err" id="lerr"></div>
      <button id="lbtn" onclick="doLogin()">Login</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminView" class="hidden">
    <div class="card">
      <div class="label">Deposit / Withdrawal Entry</div>
      <select id="qUser"><option value="">User chuno</option></select>
      <input id="qamt" type="number" inputmode="decimal" placeholder="Amount (₹)">
      <input id="qreason" placeholder="Reason (kis liye deposit/withdrawal?)">
      <div class="err" id="qerr"></div>
      <div class="row">
        <button class="green" onclick="addTxn('deposit','q')">+ Deposit</button>
        <button class="red" onclick="addTxn('withdraw','q')">− Withdraw</button>
      </div>
    </div>

    <div class="card">
      <div class="label">Naya User (ID + Password banao)</div>
      <input id="nname" placeholder="Naam">
      <input id="nid" placeholder="User ID (letters/numbers)" autocapitalize="none">
      <input id="npass" placeholder="Temporary password (min 4) - user pehli baar badlega">
      <input id="nbal" type="number" inputmode="decimal" placeholder="Opening balance (optional)">
      <div class="err" id="nerr"></div>
      <button onclick="createUser()">User Banao</button>
    </div>

    <div class="card">
      <div class="label">Saare Users</div>
      <div id="userList"><div class="empty">Loading...</div></div>
      <button class="sec" style="margin-top:10px" onclick="loadUsers()">🔄 Refresh</button>
    </div>

    <button class="sec" onclick="logout()">Logout</button>
  </div>

  <!-- ADMIN: ONE USER -->
  <div id="adminUserView" class="hidden">
    <button class="sec" style="margin-bottom:14px" onclick="backToList()">← Wapas</button>
    <div class="card">
      <div class="bal"><small id="auName"></small><h2 id="auBal">₹0</h2><small id="auId"></small></div>
    </div>
    <div class="card">
      <div class="label">Deposit / Withdrawal</div>
      <input id="tamt" type="number" inputmode="decimal" placeholder="Amount (₹)">
      <input id="treason" placeholder="Reason (kyu?)">
      <div class="err" id="terr"></div>
      <div class="row">
        <button class="green" onclick="addTxn('deposit')">+ Deposit</button>
        <button class="red" onclick="addTxn('withdraw')">− Withdraw</button>
      </div>
    </div>
    <div class="card">
      <div class="label">History</div>
      <div id="auHist"></div>
    </div>
    <div class="card">
      <div class="label">User Settings</div>
      <input id="resetPass" placeholder="Naya temporary password">
      <button class="sec" onclick="resetPassword()">Password Reset Karo</button>
      <p style="font-size:11px;color:var(--gray);margin-top:8px">Reset ke baad user ko ye temporary password dena. Login karte hi use apna naya password set karna padega.</p>
      <button class="red" style="margin-top:10px" onclick="deleteUser()">User Delete Karo</button>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCFKhWdoGWWjIs7Z6yIEOZdx58ybp07jD0",
  authDomain: "playing11-819b0.firebaseapp.com",
  projectId: "playing11-819b0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Collections (alag naam taaki purane project ka data na mile)
const USERS = "wallet_users";
const TXNS = "wallet_txns";
// ====== ADMIN ID & PASSWORD (yahin se badlo) ======
const ADMIN_ID = "admin";
const ADMIN_PASS = "admin@123";
// ==================================================


let currentUserId = null;
const $ = id => document.getElementById(id);
const show = id => { ["loginView","adminView","adminUserView"].forEach(v => $(v).classList.add("hidden")); $(id).classList.remove("hidden"); };
const money = n => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
async function hash(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function fmtDate(ts){ if(!ts||!ts.toDate) return "abhi"; return ts.toDate().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
const SKEY = "wallet_admin_session";

async function doLogin(){
  const id = $("lid").value.trim(), pass = $("lpass").value;
  if(!id || !pass){ $("lerr").textContent = "ID aur password dalo"; return; }
  if(id !== ADMIN_ID || pass !== ADMIN_PASS){ $("lerr").textContent = "Galat ID ya password"; return; }
  $("lerr").textContent = "";
  localStorage.setItem(SKEY, JSON.stringify({ id, p: await hash(pass) }));
  show("adminView"); loadUsers();
}

function logout(){ localStorage.removeItem(SKEY); currentUserId = null; $("lpass").value = ""; show("loginView"); }

async function restoreSession(){
  try {
    const s = JSON.parse(localStorage.getItem(SKEY) || "null");
    if(s && s.id === ADMIN_ID && s.p === await hash(ADMIN_PASS)){ show("adminView"); loadUsers(); }
  } catch(e){ }
}

// ---------- ADMIN: USERS ----------
async function createUser(){
  const name = $("nname").value.trim(), id = $("nid").value.trim().toLowerCase(), pass = $("npass").value, bal = parseFloat($("nbal").value) || 0;
  const err = $("nerr"); err.textContent = "";
  if(!name || !id || pass.length < 4){ err.textContent = "Naam, ID aur password (min 4) dalo"; return; }
  if(!/^[a-z0-9_.-]+$/.test(id)){ err.textContent = "ID me sirf letters, numbers, _ . - allowed"; return; }
  if(bal < 0){ err.textContent = "Opening balance negative nahi ho sakta"; return; }
  try {
    const ref = db.collection(USERS).doc(id);
    if((await ref.get({ source: "server" })).exists){ err.textContent = "Ye User ID pehle se hai"; return; }
    const passHash = await hash(pass);
    const batch = db.batch();
    batch.set(ref, { name, passHash, mustChange: true, balance: bal, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    if(bal > 0) batch.set(db.collection(TXNS).doc(), { userId: id, type: "deposit", amount: bal, reason: "Opening balance", balanceAfter: bal, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
    await batch.commit();
    ["nname","nid","npass","nbal"].forEach(x => $(x).value = "");
    toast("User ban gaya"); loadUsers();
  } catch(e){ err.textContent = "Error: " + e.message; }
}

async function loadUsers(){
  const box = $("userList"); box.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const snap = await db.collection(USERS).get();
    if(snap.empty){ $("qUser").innerHTML = '<option value="">User chuno</option>'; box.innerHTML = '<div class="empty">Abhi koi user nahi</div>'; return; }
    const rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.name.localeCompare(b.name));
    const sel = $("qUser"), keep = sel.value;
    sel.innerHTML = '<option value="">User chuno</option>' + rows.map(u => `<option value="${esc(u.id)}">${esc(u.name)} (@${esc(u.id)}) — ${money(u.balance)}</option>`).join("");
    sel.value = keep;
    box.innerHTML = rows.map(u => `
      <div class="item user-row" onclick="openUser('${esc(u.id)}')">
        <div class="l"><div class="t">${esc(u.name)}</div><div class="s">@${esc(u.id)}${u.mustChange ? " • ⏳ temp password" : ""}</div></div>
        <div class="r"><div class="t">${money(u.balance)}</div></div>
      </div>`).join("");
  } catch(e){ box.innerHTML = '<div class="empty">Error: ' + esc(e.message) + '</div>'; }
}

// ---------- ADMIN: ONE USER ----------
async function openUser(id){
  currentUserId = id; show("adminUserView");
  $("terr").textContent = ""; $("tamt").value = ""; $("treason").value = ""; $("resetPass").value = "";
  await refreshAdminUser();
}
function backToList(){ currentUserId = null; show("adminView"); loadUsers(); }

async function refreshAdminUser(){
  const d = await db.collection(USERS).doc(currentUserId).get({ source: "server" });
  if(!d.exists){ backToList(); return; }
  $("auName").textContent = d.data().name; $("auId").textContent = "@" + currentUserId + (d.data().mustChange ? "  •  ⏳ temporary password (user ne abhi nahi badla)" : "  •  ✅ user ne apna password set kar liya"); $("auBal").textContent = money(d.data().balance);
  renderHistory(currentUserId, "auHist");
}

async function addTxn(type, p = "t"){
  const uid = p === "q" ? $("qUser").value : currentUserId;
  const amt = Math.round((parseFloat($(p + "amt").value) || 0) * 100) / 100, reason = $(p + "reason").value.trim();
  const err = $(p + "err"); err.textContent = "";
  if(!uid){ err.textContent = "Pehle user chuno"; return; }
  if(amt <= 0){ err.textContent = "Sahi amount dalo"; return; }
  if(!reason){ err.textContent = "Reason zaroor likho"; return; }
  const uref = db.collection(USERS).doc(uid);
  try {
    await db.runTransaction(async tx => {
      const u = await tx.get(uref);
      if(!u.exists) throw new Error("User nahi mila");
      const cur = u.data().balance || 0;
      const nb = Math.round((type === "deposit" ? cur + amt : cur - amt) * 100) / 100;
      if(nb < 0) throw new Error("Balance kam hai (" + money(cur) + ")");
      tx.update(uref, { balance: nb });
      tx.set(db.collection(TXNS).doc(), { userId: uid, type, amount: amt, reason, balanceAfter: nb, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
    });
    $(p + "amt").value = ""; $(p + "reason").value = "";
    toast(type === "deposit" ? "Deposit ho gaya" : "Withdrawal ho gaya");
    if(p === "q") loadUsers(); else await refreshAdminUser();
  } catch(e){ err.textContent = e.message; }
}

async function resetPassword(){
  const p = $("resetPass").value;
  if(p.length < 4){ toast("Password min 4 character"); return; }
  await db.collection(USERS).doc(currentUserId).update({ passHash: await hash(p), mustChange: true });
  $("resetPass").value = ""; toast("Reset ho gaya, user naya password set karega"); refreshAdminUser();
}

async function deleteUser(){
  if(!confirm("User aur uski saari history delete ho jayegi. Pakka?")) return;
  try {
    const snap = await db.collection(TXNS).where("userId", "==", currentUserId).get();
    for(let i = 0; i < snap.docs.length; i += 400){
      const b = db.batch(); snap.docs.slice(i, i+400).forEach(d => b.delete(d.ref)); await b.commit();
    }
    await db.collection(USERS).doc(currentUserId).delete();
    toast("User delete ho gaya"); backToList();
  } catch(e){ toast("Error: " + e.message); }
}

// ---------- HISTORY (admin + user dono) ----------
async function renderHistory(uid, boxId){
  const box = $(boxId); box.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const snap = await db.collection(TXNS).where("userId", "==", uid).get();
    if(snap.empty){ box.innerHTML = '<div class="empty">Abhi koi entry nahi</div>'; return; }
    const rows = snap.docs.map(d => d.data()).sort((a,b) => (b.timestamp?.seconds ?? 9e12) - (a.timestamp?.seconds ?? 9e12));
    box.innerHTML = rows.map(t => `
      <div class="item">
        <div class="l"><div class="t">${esc(t.reason)}</div><div class="s">${fmtDate(t.timestamp)}</div></div>
        <div class="r"><div class="${t.type==='deposit'?'cr':'dr'}">${t.type==='deposit'?'+':'−'}${money(t.amount)}</div><div class="s">Bal: ${money(t.balanceAfter)}</div></div>
      </div>`).join("");
  } catch(e){ box.innerHTML = '<div class="empty">Error: ' + esc(e.message) + '</div>'; }
}

$("lpass").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
restoreSession();
</script>
</body>
</html>

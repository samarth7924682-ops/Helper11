<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#121418;--card:#1e222b;--gold:#ffb703;--text:#fff;--gray:#94a3b8;--green:#2ecc71;--red:#e74c3c;--line:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:var(--text);padding:16px;display:flex;justify-content:center;min-height:100vh}
.wrapper{width:100%;max-width:480px}
header{text-align:center;margin-bottom:18px}
header h1{font-family:'Oswald',sans-serif;color:var(--gold);font-size:26px;text-transform:uppercase;letter-spacing:1px}
header p{font-size:11px;color:var(--gray)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.label{font-family:'Oswald',sans-serif;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin:0 0 10px 2px}
input,select{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:#12151b;color:var(--text);font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--gold);color:#000;font-weight:600;font-size:14px;cursor:pointer}
button:disabled{opacity:.5}
button.sec{background:transparent;border:1px solid var(--line);color:var(--gray)}
button.green{background:var(--green)}
button.red{background:var(--red);color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.hidden{display:none!important}
.err{color:var(--red);font-size:12px;margin:-4px 0 10px 2px;min-height:14px}
.bal{text-align:center;padding:10px 0}
.bal small{color:var(--gray);font-size:12px}
.bal h2{font-family:'Oswald',sans-serif;font-size:40px;color:var(--gold)}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.item:last-child{border-bottom:none}
.item .l{min-width:0}
.item .t{font-size:14px;font-weight:600;word-break:break-word}
.item .s{font-size:11px;color:var(--gray)}
.item .r{text-align:right;white-space:nowrap}
.cr{color:var(--green);font-weight:600}
.dr{color:var(--red);font-weight:600}
.user-row{cursor:pointer}
.empty{text-align:center;color:var(--gray);font-size:13px;padding:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{background:var(--card);color:var(--gray);border:1px solid var(--line)}
.tabs button.on{background:var(--gold);color:#000}
</style>
</head>
<body>
<div class="wrapper">
  <header><h1>💰 My Wallet</h1><p>Apna hisab, apne haath</p></header>

  <!-- LOGIN -->
  <div id="loginView">
    <div class="card">
      <div class="label">Login</div>
      <input id="lid" placeholder="User ID" autocomplete="username" autocapitalize="none">
      <input id="lpass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="err" id="lerr"></div>
      <button id="lbtn" onclick="doLogin()">Login</button>
    </div>
  </div>

  <!-- NAYA PASSWORD (pehli baar / admin reset ke baad) -->
  <div id="setPassView" class="hidden">
    <div class="card">
      <div class="label">Apna Naya Password Banao</div>
      <p style="font-size:12px;color:var(--gray);margin-bottom:12px">Ye password admin ne diya tha. Ab apna khud ka password set karo, uske baad admin wala password kaam nahi karega.</p>
      <input id="np1" type="password" placeholder="Naya password (min 4)" autocomplete="new-password">
      <input id="np2" type="password" placeholder="Naya password dobara" autocomplete="new-password">
      <div class="err" id="nperr"></div>
      <button id="npbtn" onclick="saveNewPassword()">Password Set Karo</button>
      <button class="sec" style="margin-top:10px" onclick="cancelSetPass()">Cancel</button>
    </div>
  </div>

  <!-- USER PANEL -->
  <div id="userView" class="hidden">
    <div class="card">
      <div class="bal"><small id="uName"></small><h2 id="uBal">₹0</h2><small>Current Balance</small></div>
    </div>
    <div class="card">
      <div class="label">Mera Hisab</div>
      <div id="uHist"></div>
      <button class="sec" style="margin-top:10px" onclick="loadMyData()">🔄 Refresh</button>
    </div>
    <button class="sec" onclick="logout()">Logout</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCFKhWdoGWWjIs7Z6yIEOZdx58ybp07jD0",
  authDomain: "playing11-819b0.firebaseapp.com",
  projectId: "playing11-819b0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Collections (alag naam taaki purane project ka data na mile)
const USERS = "wallet_users";
const TXNS = "wallet_txns";



let me = null, pendingId = null, pendingOldHash = null;
const $ = id => document.getElementById(id);
const show = id => { ["loginView","setPassView","userView"].forEach(v => $(v).classList.add("hidden")); $(id).classList.remove("hidden"); };
const money = n => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
async function hash(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function fmtDate(ts){ if(!ts||!ts.toDate) return "abhi"; return ts.toDate().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
const SKEY = "wallet_user_session";

async function doLogin(){
  const id = $("lid").value.trim().toLowerCase(), pass = $("lpass").value;
  if(!id || !pass){ $("lerr").textContent = "ID aur password dalo"; return; }
  $("lbtn").disabled = true; $("lerr").textContent = "";
  try {
    const h = await hash(pass);
    const d = await db.collection(USERS).doc(id).get({ source: "server" });
    if(!d.exists || d.data().passHash !== h){ $("lerr").textContent = "Galat ID ya password"; return; }
    if(d.data().mustChange){
      pendingId = id; pendingOldHash = h;
      $("np1").value = ""; $("np2").value = ""; $("nperr").textContent = "";
      show("setPassView"); return;
    }
    localStorage.setItem(SKEY, JSON.stringify({ id, h }));
    me = id; show("userView"); loadMyData();
  } catch(e){ $("lerr").textContent = "Error: " + e.message; }
  finally { $("lbtn").disabled = false; }
}

async function saveNewPassword(){
  const p1 = $("np1").value, p2 = $("np2").value, err = $("nperr");
  err.textContent = "";
  if(p1.length < 4){ err.textContent = "Password kam se kam 4 character ka rakho"; return; }
  if(p1 !== p2){ err.textContent = "Dono password same nahi hain"; return; }
  $("npbtn").disabled = true;
  try {
    const nh = await hash(p1);
    if(nh === pendingOldHash){ err.textContent = "Naya password admin wale se alag rakho"; return; }
    const ref = db.collection(USERS).doc(pendingId);
    const d = await ref.get({ source: "server" });
    if(!d.exists || d.data().passHash !== pendingOldHash){ err.textContent = "Password admin ne badal diya hai, dobara login karo"; return; }
    await ref.update({ passHash: nh, mustChange: false });
    localStorage.setItem(SKEY, JSON.stringify({ id: pendingId, h: nh }));
    me = pendingId; pendingId = null; pendingOldHash = null;
    $("lpass").value = "";
    show("userView"); loadMyData();
  } catch(e){ err.textContent = "Error: " + e.message; }
  finally { $("npbtn").disabled = false; }
}

function cancelSetPass(){ pendingId = null; pendingOldHash = null; $("lpass").value = ""; show("loginView"); }

function logout(){ localStorage.removeItem(SKEY); me = null; $("lpass").value = ""; show("loginView"); }

async function restoreSession(){
  try {
    const s = JSON.parse(localStorage.getItem(SKEY) || "null");
    if(!s) return;
    const d = await db.collection(USERS).doc(s.id).get();
    if(d.exists && d.data().passHash === s.h && !d.data().mustChange){ me = s.id; show("userView"); loadMyData(); }
  } catch(e){ }
}

// ---------- HISTORY (admin + user dono) ----------
async function renderHistory(uid, boxId){
  const box = $(boxId); box.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const snap = await db.collection(TXNS).where("userId", "==", uid).get();
    if(snap.empty){ box.innerHTML = '<div class="empty">Abhi koi entry nahi</div>'; return; }
    const rows = snap.docs.map(d => d.data()).sort((a,b) => (b.timestamp?.seconds ?? 9e12) - (a.timestamp?.seconds ?? 9e12));
    box.innerHTML = rows.map(t => `
      <div class="item">
        <div class="l"><div class="t">${esc(t.reason)}</div><div class="s">${fmtDate(t.timestamp)}</div></div>
        <div class="r"><div class="${t.type==='deposit'?'cr':'dr'}">${t.type==='deposit'?'+':'−'}${money(t.amount)}</div><div class="s">Bal: ${money(t.balanceAfter)}</div></div>
      </div>`).join("");
  } catch(e){ box.innerHTML = '<div class="empty">Error: ' + esc(e.message) + '</div>'; }
}

// ---------- USER VIEW ----------
async function loadMyData(){
  const d = await db.collection(USERS).doc(me).get({ source: "server" });
  if(!d.exists){ logout(); return; }
  $("uName").textContent = "Namaste, " + d.data().name; $("uBal").textContent = money(d.data().balance);
  renderHistory(me, "uHist");
}

$("lpass").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
restoreSession();
</script>
</body>
</html>
